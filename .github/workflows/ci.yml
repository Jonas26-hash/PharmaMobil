name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tests y compilacion (unit tests + Android debug)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # En Windows el bit de ejecucion no importa, pero Ubuntu runner lo exige.
      - name: Dar permisos de ejecucion al wrapper
        run: chmod +x ./gradlew

      - name: Tests unitarios
        run: ./gradlew :shared:testAndroidHostTest --console=plain

      - name: Compilar el modulo compartido
        run: ./gradlew :shared:compileKotlinMetadata --console=plain

      - name: Compilar el APK de debug
        run: ./gradlew :androidApp:assembleDebug --console=plain

      - name: Publicar informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: shared/build/reports/tests/**
          retention-days: 7
